name: RAVEL V0 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node.js (for pyright)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pyright
        run: npm install -g pyright

      - name: Create venv and install Python dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Start infrastructure
        run: uv run scripts/dev_up.sh

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Lint
        run: uv run make lint

      - name: Unit tests
        run: uv run make test-unit

      - name: Integration tests
        run: uv run make test-integration

      - name: End-to-end tests
        run: uv run make test-e2e

      - name: Acceptance matrix
        run: uv run make acceptance

      - name: Check for credential secrets
        id: secrets
        run: |
          echo "has_dsh_key=${{ secrets.DEEPSEEK_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
          echo "has_email=${{ secrets.RAVEL_RESEARCH_CONTACT_EMAIL != '' }}" >> "$GITHUB_OUTPUT"

      - name: DSH gate
        if: steps.secrets.outputs.has_dsh_key == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: uv run make test-dsh

      - name: Live research
        if: steps.secrets.outputs.has_email == 'true'
        env:
          RAVEL_RESEARCH_CONTACT_EMAIL: ${{ secrets.RAVEL_RESEARCH_CONTACT_EMAIL }}
        run: uv run make test-live

      - name: Stop infrastructure
        if: always()
        run: uv run scripts/dev_down.sh
