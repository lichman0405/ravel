# Alembic configuration for RAVEL's authoritative Project State.
#
# The database URL is deliberately absent: `env.py` reads it from
# `ravel.config.Settings`, so there is exactly one place the DSN is defined and
# no checked-in file can disagree with it or leak a password.

[alembic]
script_location = src/ravel/state/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Revision identifiers are timestamped and readable, so a filename says when a
# change was made without opening it.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
